name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven
          
      - name: Run Backend Tests
        working-directory: backend
        run: ./mvnw test

  frontend-tests:
    name: Frontend Tests
    needs: backend-tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
        
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --watch=false

  mobile-tests:
    name: Mobile Tests
    needs: frontend-tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          
      - name: Run Mobile Tests
        working-directory: mobile
        run: ./gradlew test
